<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document with Nav Link Hover Effect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        nav {
            display: flex;
            gap: 20px;
        }
        .first-links a {
            text-decoration: none;
            color: #fff;
            position: relative;
            font-size: 16px;
        }
        .first-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            display: block;
            margin: auto;
            background: orange;
            transition: width 0.5s ease;
            left: 0;
            right: 0;
        }
        .first-links a:hover::after {
            width: 100%;
        }
        
       
        .second-links a {
            text-decoration: none;
            color: #fff;
            position: relative;
            font-size: 16px;
        }
        
        .second-links a::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: orange;
            bottom: 0;
            left: 0;
            transform-origin: right;
            transform: scaleX(0);
            transition: transform .3s ease-in-out;
        }
        
        .second-links a:hover::before {
            transform-origin: left;
            transform: scaleX(1);
        }
      
        .second-links {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <nav class="first-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <nav class="second-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</body>
</html>
