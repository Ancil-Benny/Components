<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Hover-Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .first-links a {
            text-decoration: none;
            color: #fff;
            position: relative;
            font-size: 16px;
        }
        .first-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            display: block;
            margin: auto;
            background: orange;
            transition: width 0.5s ease;
            left: 0;
            right: 0;
        }
        .first-links a:hover::after {
            width: 100%;
        }
        
       
        .second-links a {
            text-decoration: none;
            color: #fff;
            position: relative;
            font-size: 16px;
        }
        
        .second-links a::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: orange;
            bottom: 0;
            left: 0;
            transform-origin: right;
            transform: scaleX(0);
            transition: transform .3s ease-in-out;
        }
        
        .second-links a:hover::before {
            transform-origin: left;
            transform: scaleX(1);
        }
        
       
        .third-links a {
            position: relative;
            overflow: hidden;
            display: block;
            text-align: center;
            flex-grow: 1;
            animation-duration: 1s;
            animation-fill-mode: both;
            padding: 0;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
        }
        .third-links a span {
            display: block;
            transition: transform 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .third-links a:after {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            content: attr(data-hover);
            display: inline;
            text-align: center;
            transition: top 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: #fff;
        }
        .third-links a:hover {
            color: #cc8e35;
        }
        .third-links a:hover span {
            color: #cc8e35;
            transform: translateY(-100%);
        }
        .third-links a:hover:after {
            top: 0;
        }
        .third-links a:active {
            animation-name: rubberBand;
        }
        
       
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Nav Hover Links</h1>
    <nav class="first-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <nav class="second-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <nav class="third-links">
        <a href="#" data-hover="Home"><span>Home</span></a>
        <a href="#" data-hover="About"><span>About</span></a>
        <a href="#" data-hover="Services"><span>Services</span></a>
        <a href="#" data-hover="Contact"><span>Contact</span></a>
    </nav>
</body>
</html>
